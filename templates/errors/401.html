{% extends "base.html" %}

{% block title %}401 - Unauthorized{% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-100 align-items-center">
        <div class="col-12 text-center">
            <div class="animate-fade-in">
                <i class="fas fa-sign-in-alt fa-5x text-info mb-4"></i>
                <h1 class="display-1 fw-bold text-info">401</h1>
                <h2 class="mb-3">Unauthorized Access</h2>
                <p class="text-muted lead">Please log in to access this page.</p>
                <div class="mt-4">
                    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg me-2">
                        <i class="fas fa-sign-in-alt me-2"></i> Login
                    </a>
                    <a href="{{ url_for('auth.register') }}" class="btn btn-outline-primary btn-lg">
                        <i class="fas fa-user-plus me-2"></i> Register
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
