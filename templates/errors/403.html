{% extends "base.html" %}

{% block title %}403 - Access Denied{% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-100 align-items-center">
        <div class="col-12 text-center">
            <div class="animate-fade-in">
                <i class="fas fa-lock fa-5x text-warning mb-4"></i>
                <h1 class="display-1 fw-bold text-warning">403</h1>
                <h2 class="mb-3">Access Denied</h2>
                <p class="text-muted lead">You do not have permission to access this page.</p>
                <p class="text-muted">Please contact your administrator if you believe this is an error.</p>
                <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('index') }}" 
                   class="btn btn-primary btn-lg mt-3">
                    <i class="fas fa-home me-2"></i> Go Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
