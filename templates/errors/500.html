{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-100 align-items-center">
        <div class="col-12 text-center">
            <div class="animate-fade-in">
                <i class="fas fa-exclamation-triangle fa-5x text-danger mb-4"></i>
                <h1 class="display-1 fw-bold text-danger">500</h1>
                <h2 class="mb-3">Internal Server Error</h2>
                <p class="text-muted lead">Something went wrong on our end. Please try again later.</p>
                <p class="text-muted">We have been notified of this issue and will fix it as soon as possible.</p>
                <div class="mt-4">
                    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('index') }}" 
                       class="btn btn-primary btn-lg me-2">
                        <i class="fas fa-home me-2"></i> Go Home
                    </a>
                    <button class="btn btn-outline-secondary btn-lg" onclick="location.reload()">
                        <i class="fas fa-sync me-2"></i> Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
